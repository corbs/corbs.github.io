<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Sea Dragon</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* Loading screen: a blank black page with SEA DRAGON in the game's own pixel font (sea blue), centred, and a
   blocky load bar under it. The stage is 336x216 CSS px and is scaled up in whole steps by the script below. */
#status {
	position: absolute;
	top: 0;
	right: 0;
	bottom: 0;
	left: 0;
	background-color: #000000;
	display: flex;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

/* Light bleed: a soft halo of the same sea blue, fainter than the letters around the text and the filled blocks. */
#stage {
	--bleed: drop-shadow(0 0 3px rgba(8, 47, 202, 0.55)) drop-shadow(0 0 9px rgba(8, 47, 202, 0.4));
	position: relative;
	flex: none;
	width: 336px;
	height: 216px;
	image-rendering: pixelated;
	transform-origin: center center;
}

#title {
	filter: var(--bleed);
	position: absolute;
	left: 128px;
	top: 98px;
	width: 80px;
	height: 8px;
	image-rendering: pixelated;
}

/* The tribute line under the bar: two lines of the same pixel font, centred (280x20 px, left edge at (336-280)/2). */
#credit {
	filter: var(--bleed);
	position: absolute;
	left: 28px;
	top: 138px;
	width: 280px;
	height: 20px;
	image-rendering: pixelated;
}

/* 22 blocks (20 for the real loading progress, 2 filled in just before the start screen) of 7 px with a 1 px gap. The empty track is dim, the filled part is sea blue. */
#bar-track, #bar-fill {
	position: absolute;
	left: 80px;
	top: 118px;
	height: 8px;
	background-image: repeating-linear-gradient(90deg, currentColor 0 7px, transparent 7px 8px);
}

#bar-track {
	width: 176px;
	color: rgba(8, 47, 202, 0.3);
}

#bar-fill {
	width: 0;
	color: #082fca;
	filter: var(--bleed);
}
#status-notice {
	display: none;
	position: absolute;
	left: 0;
	right: 0;
	bottom: 8%;
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<div id="stage">
				<canvas id="title" width="80" height="8"></canvas>
				<div id="bar-track"></div>
				<div id="bar-fill"></div>
				<canvas id="credit" width="280" height="20"></canvas>
			</div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":689700,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const stage = document.getElementById('stage');
	const barFill = document.getElementById('bar-fill');
	const statusNotice = document.getElementById('status-notice');

	const BLOCKS = 20;        // blocks that follow the real loading progress
	const EXTRA_BLOCKS = 2;   // filled in just before the start screen, only if loading finished early
	const BLOCK_PX = 8;

	let initializing = true;
	let statusMode = '';
	let waiting = null;   // timer for the moving blocks, used while the total size is not known

	// Whole-number scaling keeps the blocks crisp; on a small screen it shrinks to fit.
	function fitStage() {
		const s = Math.min(window.innerWidth / 336, window.innerHeight / 216) * 0.9;
		stage.style.transform = 'scale(' + (s >= 2 ? Math.floor(s) : Math.max(s, 0.5)) + ')';
	}
	window.addEventListener('resize', fitStage);
	fitStage();

	// "SEA DRAGON" from the game's label font atlas (8x8 cells), tinted sky blue.
	(function () {
		const CHARS = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ:.- ';
		const TEXT = 'SEA DRAGON';
		const atlas = new Image();
		// Draws `lines` (each centred, 12 px apart) onto the canvas in `colour`. The font has no apostrophe, so
		// that one is drawn as a small tick.
		function drawText(canvasId, lines, colour) {
			const c = document.getElementById(canvasId);
			const g = c.getContext('2d');
			g.imageSmoothingEnabled = false;
			lines.forEach(function (text, row) {
				const x0 = Math.floor((c.width - text.length * 8) / 2);
				const y0 = row * 12;
				for (let i = 0; i < text.length; i++) {
					const ch = text[i];
					const k = CHARS.indexOf(ch);
					if (k >= 0 && ch !== ' ') {
						g.drawImage(atlas, k * 8, 0, 8, 8, x0 + i * 8, y0, 8, 8);
					} else if (ch === "'") {
						g.fillRect(x0 + i * 8 + 3, y0, 1, 3);
					}
				}
			});
			g.globalCompositeOperation = 'source-in';
			g.fillStyle = colour;
			g.fillRect(0, 0, c.width, c.height);
		}
		atlas.onload = function () {
			drawText('title', [TEXT], '#082fca');
			drawText('credit', ['BY RUSS WETMORE'], '#3a63e0');
		};
		atlas.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAUAAAAAICAYAAACI7CYfAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAAH9SURBVGhD7ZBbbsMwDAR9/0u3IAo6qykfkhKjRuH5yu4sbSPHcRzHF7COzLhs03kn8uPli2pTOafaqHvX0xnqo03ljM4bsz7aRC7L2kXOyTarmdCvZu1mnKE+2lTOUN9t2Dv0d8/E/Z/DD2LWjr263cyeLuqUzhPu/1smq341d70SbbTrfIR7EnnN9HfJGdmO/d0yyXzWX46+2H9HH5L1pNtF3rsZZ0Reu4xoy+6vM6HvMvm0Z+56Jdp4Fzn17J3x+sWqv0vOyHbsP521i9yMdypfuUs5vxpkO/ZKtTkfnPy5/J3BjWdlvPhhxmUbeqNyRuXPBzffZdBnWTmPN70x67ljr0Sb84HJbeUMvVfouY18lRV31Z5ZOY+TDb2ROfa7mbjnjr3zrt/Fn0u4S+FR9oCsdzrvcOeZjFcv6LucdQ4dM6H/dCb0XSarfjV3vRJtvIucevYO/dWZuCeZH69/k+1m+91M3Ecbdc6uc2Y2l8AXM3e9seKYlcixW81Z59AxE/q7ZbLqV/NKH21WfAT91Zmoj7adJ9lmtmfWbsY59Fne7Um1c5f5t9EXRC+pPJ1TbdQpmR+v9z17Z7z+vas8uywr53GyqZzReYNeb8h4GT8/y9pFjj5zXSb0u1m7ymlHxusf6LqsuFNm3Mym61fzbE+4q9i9e3h4eHgo+AbL2oJDaseRFAAAAABJRU5ErkJggg==';
	}());
	function showBlocks(n) {
		barFill.style.width = (Math.max(0, Math.min(BLOCKS + EXTRA_BLOCKS, n)) * BLOCK_PX) + 'px';
	}

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			if (waiting !== null) {
				clearInterval(waiting);
			}
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		stage.style.display = mode === 'notice' ? 'none' : 'block';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		const MIN_SHOW_MS = 4000;
		const shownAt = performance.now();
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					if (waiting !== null) {
						clearInterval(waiting);
						waiting = null;
					}
					showBlocks(Math.floor(BLOCKS * current / total));
				} else if (waiting === null) {
					// Size not known yet: run a few blocks back and forth.
					let n = 0;
					waiting = setInterval(() => showBlocks(++n % (BLOCKS + 1)), 90);
				}
			},
		}).then(() => {
			// Keep the loader (and the credit) up for at least 4 seconds so it can be read. If loading finished
			// early, the two extra blocks fill in just before the start screen; if it took longer, just go.
			if (waiting !== null) {
				clearInterval(waiting);
				waiting = null;
			}
			const left = MIN_SHOW_MS - (performance.now() - shownAt);
			if (left <= 0) {
				setStatusMode('hidden');
				return;
			}
			showBlocks(BLOCKS);
			setTimeout(() => showBlocks(BLOCKS + 1), Math.max(0, left - 300));
			setTimeout(() => showBlocks(BLOCKS + 2), Math.max(0, left - 150));
			setTimeout(() => setStatusMode('hidden'), left);
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
